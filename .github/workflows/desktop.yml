# Builds the Windows installer of Coffre PC (Coffre-PC-Setup-<version>.exe).
# Run it by hand (Actions -> Coffre PC (Windows) -> Run workflow) or push a tag like pc-v0.10.0 to also publish a release.
name: Coffre PC (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['pc-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        working-directory: desktop
        env:
          # Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables)
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_PRICE_LABEL: ${{ vars.VITE_PRICE_LABEL }}
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Coffre-PC-Windows
          path: desktop/dist/*.exe
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/dist/*.exe \
            --title "Coffre PC ${GITHUB_REF_NAME#pc-v}" \
            --notes-file desktop/RELEASE_NOTES.md
